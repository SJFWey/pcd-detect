dataset:
  root: "./data"
  sequence: "08"

frames:
  start: 0
  end: 500
  step: 1

preprocess:
  roi:
    x_min: 0.0
    x_max: 70.0
    y_min: -40.0
    y_max: 40.0
    z_min: -3.0
    z_max: 3.0
  voxel:
    enabled: true
    mode: "fixed"
    voxel_size: 0.1

ground:
  distance_threshold: 0.2
  ransac_n: 3
  num_iterations: 1000
  min_normal_z: 0.9
  random_seed: 0
  z_min: -2.5
  z_max: -0.5

proposals:
  method: "dbscan"
  dbscan:
    mode: "fixed"
    eps: 0.55
    min_points: 12
    distance_bins: [0, 20, 40, 60]
    bin_eps: [0.4, 0.6, 1.0]
    bin_min_points: [10, 6, 4]
  bev_cc:
    resolution: 0.2
    min_height: 0.3
    min_points: 10

filtering:
  min_points: 30
  max_points: 8000
  min_height: 0.4
  max_height: 3.0
  percentile_clip: 2.0

boxes:
  method: "obb"
  z_percentile: 5.0
  min_box_volume: 0.2
  max_box_volume: 80.0

evaluation:
  official: false
  detection: true
  perf: true
  split: "valid"
  iou_threshold: 0.5
  use_3d_iou: false
  distance_bins: [0, 10, 20, 30, 40, 50]
  targets:
    car: true
    person: true
    bicyclist: false

output:
  root: "outputs/kitti08_qualitative"
  boxes_dir: "boxes"
  predictions_dir: "predictions"
  reports_dir: "reports"
  videos_dir: "videos"
  boxes_format: "jsonl"

visualization:
  display_roi:
    x_min: 0.0
    x_max: 35.0
    y_min: -12.0
    y_max: 12.0
  mode: "boxes"
  frame: 120
  enabled: true
  point_size: 1.5
  show_ground: false
  show_boxes: true
  colormap: "height"
  max_points: 80000

camera:
  elevation: 34
  azimuth: -64
  distance: 70

export:
  type: "video"
  from_boxes: false
  start: 0
  end: 180
  step: 1

video:
  fps: 10
  width: 1280
  height: 720
  debug:
    frame: 120
    num_views: 4
    frames_per_view: 20
  sequence:
    step: 5
    max_frames: 120
