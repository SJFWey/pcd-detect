# Evaluation Configuration
# Settings for detection metrics and official SemanticKITTI evaluation

# ============================================================================
# Evaluation Settings
# ============================================================================
evaluation:
  # Evaluation type toggles
  official: false     # Run official SemanticKITTI semantic IoU
  detection: true     # Run detection metrics (Precision, Recall, F1)
  perf: true         # Generate performance report from timing

  # Paths (relative to output.root or absolute)
  predictions_path: null  # null = use output.predictions_dir

  # Evaluation split
  split: "valid"  # train, valid, test

  # Detection matching
  iou_threshold: 0.5
  use_3d_iou: false  # false = use BEV IoU
  # Detection metrics filter GT/predictions to targets below and only match
  # predictions to GT with the same semantic class.

  # Distance stratification
  distance_bins: [0, 10, 20, 30, 40, 50]

  # Target classes for evaluation
  # Only these classes contribute to reported metrics
  targets:
    car: true
    person: true
    bicyclist: false

  # Custom datacfg for official eval (null = default semantic-kitti.yaml)
  datacfg: null
